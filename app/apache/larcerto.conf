
# Anything that is not a file in public/ goes to the front controller.
<Directory /var/www/larcerto/public>
    Options -Indexes
    AllowOverride None
    Require all granted
    FallbackResource /index.php
</Directory>

# Photos live outside the DocumentRoot: no PHP, and only the .webp names the app generates.
Alias /uploads/ /var/www/larcerto/storage/uploads/
<Directory /var/www/larcerto/storage/uploads>
    Options -Indexes
    AllowOverride None
    <IfModule mod_php.c>
        php_admin_flag engine off
    </IfModule>
    Require all denied
    <FilesMatch "^[0-9a-f]{32}(_thumb)?\.webp$">
        Require all granted
    </FilesMatch>
</Directory>
