; Photos: 20 MB each, 64 MB per form submission; GD needs ~160 MB to decode a 40 MP photo.
upload_max_filesize = 20M
post_max_size = 64M
; 10 photos + 1: PHP would silently drop the 11th; this way the app sees it and rejects the upload.
max_file_uploads = 11
memory_limit = 256M

; Errors go to the Apache log: a PHP warning in the page would break the app's 413 response.
display_errors = Off
log_errors = On
