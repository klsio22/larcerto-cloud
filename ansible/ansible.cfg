[defaults]
inventory = inventory/hosts.ini
roles_path = roles
host_key_checking = False
interpreter_python = auto_silent
stdout_callback = default
retry_files_enabled = False
# Handlers pedidos (ex.: recarregar o Apache) rodam mesmo se uma tarefa depois falhar; senao se perdem
# e a rodada seguinte, sem mudanca, nao recarrega (o HTTPS ficava configurado mas sem escutar na 443).
force_handlers = True

[ssh_connection]
# VMs sao recriadas pelo Terraform: a chave de host muda a cada apply.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no
pipelining = True
