---
company_name: LarCerto
domain: larcerto.com.br

# Horizon (VIP do Kolla) - REQ12: cloud.larcerto.com.br; igual ao kolla_internal_vip_address do globals.yml
cloud_vip: 10.99.0.250

# IPs privados fixos (iguais aos de terraform/variables.tf)
private_ips:
  dns: 10.11.12.10
  ca: 10.11.12.11
  db: 10.11.12.12
  web: 10.11.12.13
private_cidr: 10.11.12.0/24

# Banco usado pela app; tabela e semente vem de app/sql/ (o mesmo SQL do Compose local)
