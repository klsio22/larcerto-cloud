db_user: larcerto
db_user_host: "10.11.12.%"   # so a rede privada (web)
app_sql_dir: "{{ playbook_dir }}/../app/sql"

# PKI: copia local da CA e do certificado (fora do git), restaurada a cada apply
pki_local_dir: "{{ playbook_dir }}/files/pki"
cert_name: larcerto

# db_password vem de group_vars/all/secrets.yml (fora do git; ver secrets.yml.example)
