---
# Apache + PHP 8.4 (M05/M10; PHP do PPA ondrej/php, porque o Ubuntu 22.04 so traz o 8.1) com HTTPS do
# certificado wildcard da CA LarCerto. App: se app/public/index.php existir,
# public/, backend/ e frontend/views/ sao publicados com as mesmas configs de Apache e PHP do
# Compose; senao vai a pagina provisoria, que testa o banco.

# O PPA entra como o repositorio da MariaDB no papel db: chave do keyserver + linha deb com signed-by.
# O "repo: ppa:ondrej/php" consultava a API do Launchpad, que oscila e derrubava o playbook por timeout.
- name: Pasta de chaves do apt
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

# A chave baixada vai para um temporario e so entra em /etc/apt/keyrings depois de conferida. O keyserver
# devolve o mesmo texto com cabecalhos em ordem diferente; o binario do --dearmor nao muda (idempotente).
- name: Chave do PPA ondrej/php (keyserver, pelo fingerprint), num temporario
  ansible.builtin.get_url:
    url: "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x{{ php_ppa_fingerprint }}"
    dest: /root/ondrej-php.asc
    mode: "0600"
    force: true
    timeout: 30
  register: php_ppa_key
  retries: 5
  delay: 10
  until: php_ppa_key is succeeded
  changed_when: false

- name: Conferir o fingerprint da chave do PPA (exatamente uma chave, a esperada)
  ansible.builtin.command: gpg --show-keys --with-colons /root/ondrej-php.asc
  register: php_ppa_fpr
  changed_when: false
  failed_when: >-
    php_ppa_fpr.rc != 0 or
    (php_ppa_fpr.stdout_lines | select('match', '^fpr:') | map('split', ':') | map(attribute=9) | list) != [php_ppa_fingerprint]

- name: Converter a chave conferida para o formato binario do apt
  ansible.builtin.command: gpg --batch --yes --dearmor -o /root/ondrej-php.gpg /root/ondrej-php.asc
  changed_when: false

- name: Instalar a chave do PPA em /etc/apt/keyrings
  ansible.builtin.copy:
    src: /root/ondrej-php.gpg
    dest: /etc/apt/keyrings/ondrej-php.gpg
    remote_src: true
    owner: root
    group: root
    mode: "0644"

- name: Tirar os .list antigos do PPA ondrej/php (o apt recusa Signed-By diferente para a mesma origem)
  ansible.builtin.file:
    path: "/etc/apt/sources.list.d/{{ item }}"
    state: absent
  loop:
    - "ppa_ondrej_php_{{ ansible_distribution_release }}.list"
    - "ondrej-ubuntu-php-{{ ansible_distribution_release }}.list"

# Arquivo inteiro (copy), nao uma linha acrescentada: linhas de versoes anteriores somem junto.
- name: PPA ondrej/php (PHP 8.4 no Ubuntu 22.04, que so traz o 8.1)
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/ondrej-php.list
    content: "deb [signed-by=/etc/apt/keyrings/ondrej-php.gpg] https://ppa.launchpadcontent.net/ondrej/php/ubuntu {{ ansible_distribution_release }} main\n"
    owner: root
    group: root
    mode: "0644"

- name: Tirar a chave em texto da versao anterior
  ansible.builtin.file:
    path: /etc/apt/keyrings/ondrej-php.asc
    state: absent

- name: Atualizar o indice do apt com o PPA
  ansible.builtin.apt:
    update_cache: true
  register: php_ppa_repo
  retries: 3
  delay: 10
  until: php_ppa_repo is succeeded
  changed_when: false

- name: Instalar Apache e PHP 8.4 com GD para as fotos (mesma versao e extensoes do Compose local)
  ansible.builtin.apt:
    name: [apache2, php8.4, libapache2-mod-php8.4, php8.4-mysql, php8.4-gd]
    state: present

- name: Modulos ssl e headers
  community.general.apache2_module:
    name: "{{ item }}"
    state: present
  loop: [ssl, headers]
  notify: Recarregar Apache

- name: Certificado e chave (vindos da VM ca via files/pki)
  ansible.builtin.copy:
    src: "{{ pki_local_dir }}/{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { src: "{{ cert_name }}.crt", dest: "/etc/ssl/certs/{{ cert_name }}.crt", mode: "0644" }
    - { src: "{{ cert_name }}.key", dest: "/etc/ssl/private/{{ cert_name }}.key", mode: "0600" }
    - { src: "ca.crt", dest: "/etc/ssl/certs/{{ cert_name }}-ca.crt", mode: "0644" }
  notify: Recarregar Apache

- name: Site {{ domain }} (HTTP -> HTTPS, HTTPS com o certificado)
  ansible.builtin.template:
    src: larcerto.conf.j2
    dest: /etc/apache2/sites-available/larcerto.conf
    mode: "0644"
  notify: Recarregar Apache

- name: Front controller e /uploads sem PHP (mesmo arquivo do Compose)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../app/apache/larcerto.conf"
    dest: /etc/apache2/conf-available/larcerto.conf
    mode: "0644"
  notify: Recarregar Apache

- name: Limites das fotos no PHP do Apache (mesmo arquivo do Compose)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../app/php/larcerto.ini"
    dest: /etc/php/8.4/apache2/conf.d/99-larcerto.ini
    mode: "0644"
  notify: Recarregar Apache

- name: Habilitar o site e a conf da app e desabilitar o padrao
  ansible.builtin.command: "{{ item.cmd }}"
  args:
    creates: "{{ item.creates | default(omit) }}"
    removes: "{{ item.removes | default(omit) }}"
  loop:
    - { cmd: a2ensite larcerto, creates: /etc/apache2/sites-enabled/larcerto.conf }
    - { cmd: a2enconf larcerto, creates: /etc/apache2/conf-enabled/larcerto.conf }
    - { cmd: a2dissite 000-default, removes: /etc/apache2/sites-enabled/000-default.conf }
  notify: Recarregar Apache

- name: Diretorios da app
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: www-data
    mode: "0755"
  loop:
    - /var/www/larcerto
    - /var/www/larcerto/public
    - /var/www/larcerto/public/assets
    - /var/www/larcerto/backend
    - /var/www/larcerto/frontend
    - /var/www/larcerto/frontend/views
    - /var/www/larcerto/storage

- name: Pasta das fotos (so o Apache grava; fora do DocumentRoot)
  ansible.builtin.file:
    path: /var/www/larcerto/storage/uploads
    state: directory
    owner: www-data
    group: www-data
    mode: "0750"


- name: Configuracao do banco para a app (fora do DocumentRoot)
  ansible.builtin.template:
    src: config.php.j2
    dest: /var/www/larcerto/config.php
    owner: root
    group: www-data
    mode: "0640"

- name: Ha app CRUD em app/public?
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/../app/public/index.php"
  delegate_to: localhost
  become: false
  register: crud_app

- name: Publicar a app (front controller, back-end MVC e views)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../app/{{ item }}/"
    dest: "/var/www/larcerto/{{ item }}/"
    owner: root
    group: www-data
    mode: u=rwX,g=rX,o=rX
  loop: [public, backend, frontend/views]
  when: crud_app.stat.exists

- name: Tirar da VM os arquivos de versoes antigas (antes do MVC e o slider antigo)
  ansible.builtin.file:
    path: "/var/www/larcerto/{{ item }}"
    state: absent
  loop: [src, public/anunciar.php, public/editar.php, public/excluir.php, public/imovel.php, public/assets/styles.css,
         public/assets/vendor, public/assets/js/galeria.js]
  when: crud_app.stat.exists

- name: Cliente do MariaDB e PHP CLI para o run.sh (le o config.php e fala com a VM db)
  ansible.builtin.apt:
    name: [mariadb-client, php8.4-cli]
    state: present

- name: run.sh da app (sem o arquivo do Compose ao lado, roda no modo servidor)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../app/run.sh"
    dest: /var/www/larcerto/run.sh
    owner: root
    group: root
    mode: "0755"
  when: crud_app.stat.exists

- name: SQL da app para o run.sh (schema e semente)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../app/sql/"
    dest: /var/www/larcerto/sql/
    owner: root
    group: root
    mode: u=rwX,go=rX
  when: crud_app.stat.exists

- name: Pagina provisoria (S5 pendente)
  when: not crud_app.stat.exists
  block:
    - name: index.php provisorio
      ansible.builtin.template:
        src: placeholder.php.j2
        dest: /var/www/larcerto/public/index.php
        owner: root
        group: www-data
        mode: "0644"

    - name: Logo
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../app/public/assets/logo.svg"
        dest: /var/www/larcerto/public/assets/logo.svg
        owner: root
        group: www-data
        mode: "0644"

- name: Apache ativo no boot
  ansible.builtin.service:
    name: apache2
    state: started
    enabled: true
