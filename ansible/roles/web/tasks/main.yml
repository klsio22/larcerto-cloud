---
# Apache + PHP 8.4 (M05/M10; PHP do ppa:ondrej/php, porque o Ubuntu 22.04 so traz o 8.1) com HTTPS do
# certificado wildcard da CA LarCerto. App: se project/app/public/index.php existir,
# public/, backend/ e frontend/views/ sao publicados com as mesmas configs de Apache e PHP do
# Compose; senao vai a pagina provisoria, que testa o banco.

- name: PPA ondrej/php (PHP 8.4 no Ubuntu 22.04, que so traz o 8.1)
  ansible.builtin.apt_repository:
    repo: ppa:ondrej/php
    state: present
    update_cache: true

- name: Instalar Apache e PHP 8.4 com GD para as fotos (mesma versao e extensoes do Compose local)
  ansible.builtin.apt:
    name: [apache2, php8.4, libapache2-mod-php8.4, php8.4-mysql, php8.4-gd]
    state: present

- name: Modulos ssl e headers
  community.general.apache2_module:
    name: "{{ item }}"
    state: present
  loop: [ssl, headers]
  notify: Recarregar Apache

- name: Certificado e chave (vindos da VM ca via files/pki)
  ansible.builtin.copy:
    src: "{{ pki_local_dir }}/{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { src: "{{ cert_name }}.crt", dest: "/etc/ssl/certs/{{ cert_name }}.crt", mode: "0644" }
    - { src: "{{ cert_name }}.key", dest: "/etc/ssl/private/{{ cert_name }}.key", mode: "0600" }
    - { src: "ca.crt", dest: "/etc/ssl/certs/{{ cert_name }}-ca.crt", mode: "0644" }
  notify: Recarregar Apache

- name: Site {{ domain }} (HTTP -> HTTPS, HTTPS com o certificado)
  ansible.builtin.template:
    src: larcerto.conf.j2
    dest: /etc/apache2/sites-available/larcerto.conf
    mode: "0644"
  notify: Recarregar Apache

- name: Front controller e /uploads sem PHP (mesmo arquivo do Compose)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../app/apache/larcerto.conf"
    dest: /etc/apache2/conf-available/larcerto.conf
    mode: "0644"
  notify: Recarregar Apache

- name: Limites das fotos no PHP do Apache (mesmo arquivo do Compose)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../app/php/larcerto.ini"
    dest: /etc/php/8.4/apache2/conf.d/99-larcerto.ini
    mode: "0644"
  notify: Recarregar Apache

- name: Habilitar o site e a conf da app e desabilitar o padrao
  ansible.builtin.command: "{{ item.cmd }}"
  args:
    creates: "{{ item.creates | default(omit) }}"
    removes: "{{ item.removes | default(omit) }}"
  loop:
    - { cmd: a2ensite larcerto, creates: /etc/apache2/sites-enabled/larcerto.conf }
    - { cmd: a2enconf larcerto, creates: /etc/apache2/conf-enabled/larcerto.conf }
    - { cmd: a2dissite 000-default, removes: /etc/apache2/sites-enabled/000-default.conf }
  notify: Recarregar Apache

- name: Diretorios da app
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: www-data
    mode: "0755"
  loop:
    - /var/www/larcerto
    - /var/www/larcerto/public
    - /var/www/larcerto/public/assets
    - /var/www/larcerto/backend
    - /var/www/larcerto/frontend
    - /var/www/larcerto/frontend/views
    - /var/www/larcerto/storage

- name: Pasta das fotos (so o Apache grava; fora do DocumentRoot)
  ansible.builtin.file:
    path: /var/www/larcerto/storage/uploads
    state: directory
    owner: www-data
    group: www-data
    mode: "0750"


- name: Configuracao do banco para a app (fora do DocumentRoot)
  ansible.builtin.template:
    src: config.php.j2
    dest: /var/www/larcerto/config.php
    owner: root
    group: www-data
    mode: "0640"

- name: Ha app CRUD em project/app/public?
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/../app/public/index.php"
  delegate_to: localhost
  become: false
  register: crud_app

- name: Publicar a app (front controller, back-end MVC e views)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../app/{{ item }}/"
    dest: "/var/www/larcerto/{{ item }}/"
    owner: root
    group: www-data
    mode: u=rwX,g=rX,o=rX
  loop: [public, backend, frontend/views]
  when: crud_app.stat.exists

- name: Tirar da VM os arquivos de versoes antigas (antes do MVC e o slider antigo)
  ansible.builtin.file:
    path: "/var/www/larcerto/{{ item }}"
    state: absent
  loop: [src, public/anunciar.php, public/editar.php, public/excluir.php, public/imovel.php, public/assets/styles.css,
         public/assets/vendor, public/assets/js/galeria.js]
  when: crud_app.stat.exists

- name: Cliente do MariaDB e PHP CLI para o run.sh (le o config.php e fala com a VM db)
  ansible.builtin.apt:
    name: [mariadb-client, php8.4-cli]
    state: present

- name: run.sh da app (sem o arquivo do Compose ao lado, roda no modo servidor)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../app/run.sh"
    dest: /var/www/larcerto/run.sh
    owner: root
    group: root
    mode: "0755"
  when: crud_app.stat.exists

- name: SQL da app para o run.sh (schema e semente)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../app/sql/"
    dest: /var/www/larcerto/sql/
    owner: root
    group: root
    mode: u=rwX,go=rX
  when: crud_app.stat.exists

- name: Pagina provisoria (S5 pendente)
  when: not crud_app.stat.exists
  block:
    - name: index.php provisorio
      ansible.builtin.template:
        src: placeholder.php.j2
        dest: /var/www/larcerto/public/index.php
        owner: root
        group: www-data
        mode: "0644"

    - name: Logo
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../app/public/assets/logo.svg"
        dest: /var/www/larcerto/public/assets/logo.svg
        owner: root
        group: www-data
        mode: "0644"

- name: Apache ativo no boot
  ansible.builtin.service:
    name: apache2
    state: started
    enabled: true
