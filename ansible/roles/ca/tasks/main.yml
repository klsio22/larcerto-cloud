---
# CA com easy-rsa (M05). A PKI fica salva em files/pki/ no host (fora do git) e e
# restaurada quando as VMs sao recriadas: assim o ca.crt importado no Firefox continua valendo.

- name: Instalar easy-rsa
  ansible.builtin.apt:
    name: easy-rsa
    state: present

- name: Diretorio da CA
  ansible.builtin.set_fact:
    easyrsa_dir: /home/ubuntu/easy-rsa
    pki_files: ["ca.crt", "private/ca.key", "issued/{{ cert_name }}.crt", "private/{{ cert_name }}.key"]

- name: Copiar scripts do easy-rsa (como no M05)
  ansible.builtin.command: cp -R /usr/share/easy-rsa {{ easyrsa_dir }}
  args:
    creates: "{{ easyrsa_dir }}/easyrsa"

# ca_new (lab.sh cert renew --new-ca): a copia de seguranca ja foi feita pelo lab.sh, entao aqui
# so se apaga a PKI da VM e a copia local, e o ramo "Criar CA nova" abaixo faz o resto.
- name: Trocar a CA (ca_new=true, so pelo lab.sh cert renew --new-ca)
  when: ca_new | default(false) | bool
  block:
    - name: Apagar a PKI da VM
      ansible.builtin.file:
        path: "{{ easyrsa_dir }}/pki"
        state: absent

    - name: Apagar a CA e o certificado salvos no host (a copia esta em files/pki/backup-<data>/)
      ansible.builtin.file:
        path: "{{ pki_local_dir }}/{{ item }}"
        state: absent
      loop: ["ca.crt", "ca.key", "{{ cert_name }}.crt", "{{ cert_name }}.key", "cloud.crt", "cloud.key"]
      delegate_to: localhost
      become: false

- name: Ha copia da PKI no host?
  ansible.builtin.stat:
    path: "{{ pki_local_dir }}/ca.key"
  delegate_to: localhost
  become: false
  register: local_ca

- name: Restaurar a PKI salva
  when: local_ca.stat.exists
  block:
    - name: init-pki (vazio, so a estrutura)
      ansible.builtin.command: ./easyrsa --batch init-pki
      args:
        chdir: "{{ easyrsa_dir }}"
        creates: "{{ easyrsa_dir }}/pki"

    - name: Diretorios da PKI
      ansible.builtin.file:
        path: "{{ easyrsa_dir }}/pki/{{ item }}"
        state: directory
        mode: "0700"
      loop: [private, issued, reqs, certs_by_serial]

    - name: Base de certificados da CA (exigida para assinar de novo)
      ansible.builtin.copy:
        content: ""
        dest: "{{ easyrsa_dir }}/pki/{{ item }}"
        force: false
        mode: "0644"
      loop: [index.txt, index.txt.attr]

    - name: Serial da CA
      ansible.builtin.shell: openssl rand -hex 16 > {{ easyrsa_dir }}/pki/serial
      args:
        creates: "{{ easyrsa_dir }}/pki/serial"

    - name: Copiar CA e certificado salvos
      ansible.builtin.copy:
        src: "{{ pki_local_dir }}/{{ item | basename }}"
        dest: "{{ easyrsa_dir }}/pki/{{ item }}"
        mode: "{{ '0600' if item.startswith('private/') else '0644' }}"
      loop: "{{ pki_files }}"
      when: (pki_local_dir ~ '/' ~ (item | basename)) is file

- name: Criar CA nova
  when: not local_ca.stat.exists
  block:
    - name: init-pki
      ansible.builtin.command: ./easyrsa --batch init-pki
      args:
        chdir: "{{ easyrsa_dir }}"
        creates: "{{ easyrsa_dir }}/pki"

    - name: build-ca (CN "CA {{ company_name }}")
      ansible.builtin.command: ./easyrsa --batch --req-cn="CA {{ company_name }}" build-ca nopass
      args:
        chdir: "{{ easyrsa_dir }}"
        creates: "{{ easyrsa_dir }}/pki/ca.crt"

# cert_renew (lab.sh cert renew): tira da VM o certificado, a chave e o pedido atuais e guarda em
# pki/renewed-<data>/, para o build-server-full abaixo emitir de novo. ca.crt e ca.key ficam como estao.
- name: Renovar o certificado do servidor (cert_renew=true, mesma CA)
  when: cert_renew | default(false) | bool
  block:
    - name: Carimbo da renovacao
      ansible.builtin.set_fact:
        renew_stamp: "{{ lookup('pipe', 'date +%Y%m%d-%H%M%S') }}"

    - name: Pasta do certificado antigo
      ansible.builtin.file:
        path: "{{ easyrsa_dir }}/pki/renewed-{{ renew_stamp }}"
        state: directory
        mode: "0700"

    - name: Guardar certificado, chave e pedido antigos (so se existirem)
      ansible.builtin.command: mv {{ easyrsa_dir }}/pki/{{ item }} {{ easyrsa_dir }}/pki/renewed-{{ renew_stamp }}/
      args:
        removes: "{{ easyrsa_dir }}/pki/{{ item }}"
      loop: ["issued/{{ cert_name }}.crt", "private/{{ cert_name }}.key", "reqs/{{ cert_name }}.req"]

- name: Certificado wildcard *.{{ domain }} + {{ domain }}
  ansible.builtin.command: >-
    ./easyrsa --batch
    --subject-alt-name="DNS:{{ domain }},DNS:*.{{ domain }}"
    build-server-full {{ cert_name }} nopass
  args:
    chdir: "{{ easyrsa_dir }}"
    creates: "{{ easyrsa_dir }}/pki/issued/{{ cert_name }}.crt"

- name: Verificar certificado contra a CA
  ansible.builtin.command: openssl verify -CAfile pki/ca.crt pki/issued/{{ cert_name }}.crt
  args:
    chdir: "{{ easyrsa_dir }}"
  changed_when: false

# cert_cloud (lab.sh cert cloud): certificado do Horizon (cloud e o apelido horizon), assinado pela mesma
# CA. O lab.sh so chama este ramo quando files/pki/cloud.crt falta ou nao confere com a CA, entao o
# certificado antigo da VM vai para pki/renewed-cloud-<data>/ e um novo e emitido.
- name: Certificado do Horizon (cert_cloud=true, so pelo lab.sh cert cloud)
  when: cert_cloud | default(false) | bool
  block:
    - name: Carimbo da emissao do cloud
      ansible.builtin.set_fact:
        cloud_stamp: "{{ lookup('pipe', 'date +%Y%m%d-%H%M%S') }}"

    - name: Pasta do certificado cloud antigo
      ansible.builtin.file:
        path: "{{ easyrsa_dir }}/pki/renewed-cloud-{{ cloud_stamp }}"
        state: directory
        mode: "0700"

    - name: Guardar certificado, chave e pedido cloud antigos (so se existirem)
      ansible.builtin.command: mv {{ easyrsa_dir }}/pki/{{ item }} {{ easyrsa_dir }}/pki/renewed-cloud-{{ cloud_stamp }}/
      args:
        removes: "{{ easyrsa_dir }}/pki/{{ item }}"
      loop: ["issued/cloud.crt", "private/cloud.key", "reqs/cloud.req"]

    - name: Certificado cloud.{{ domain }} + horizon.{{ domain }}
      ansible.builtin.command: >-
        ./easyrsa --batch
        --subject-alt-name="DNS:cloud.{{ domain }},DNS:horizon.{{ domain }}"
        build-server-full cloud nopass
      args:
        chdir: "{{ easyrsa_dir }}"
        creates: "{{ easyrsa_dir }}/pki/issued/cloud.crt"

    - name: Verificar o certificado cloud contra a CA
      ansible.builtin.command: openssl verify -CAfile pki/ca.crt pki/issued/cloud.crt
      args:
        chdir: "{{ easyrsa_dir }}"
      changed_when: false

    - name: Salvar o certificado cloud no host (files/pki, fora do git)
      ansible.builtin.fetch:
        src: "{{ easyrsa_dir }}/pki/{{ item }}"
        dest: "{{ pki_local_dir }}/"
        flat: true
      loop: ["issued/cloud.crt", "private/cloud.key"]

    - name: Chave do cloud salva no host so para o dono
      ansible.builtin.file:
        path: "{{ pki_local_dir }}/cloud.key"
        mode: "0600"
      delegate_to: localhost
      become: false

- name: Dono dos arquivos da CA
  ansible.builtin.file:
    path: "{{ easyrsa_dir }}"
    owner: ubuntu
    group: ubuntu
    recurse: true

- name: Salvar PKI no host (files/pki, fora do git)
  ansible.builtin.fetch:
    src: "{{ easyrsa_dir }}/pki/{{ item }}"
    dest: "{{ pki_local_dir }}/"
    flat: true
  loop: "{{ pki_files }}"

- name: Chaves privadas salvas no host so para o dono
  ansible.builtin.file:
    path: "{{ pki_local_dir }}/{{ item }}"
    mode: "0600"
  loop: ["ca.key", "{{ cert_name }}.key"]
  delegate_to: localhost
  become: false
