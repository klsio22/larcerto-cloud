---
# MariaDB (M05) acessivel so pela rede privada. A tabela imoveis e da S5 (CRUD, pendente):
# aqui so o banco e o usuario da app.

- name: Instalar MariaDB
  ansible.builtin.apt:
    name: mariadb-server
    state: present

- name: Escutar em todas as interfaces (o SG db limita a 10.11.12.0/24)
  ansible.builtin.lineinfile:
    path: /etc/mysql/mariadb.conf.d/50-server.cnf
    regexp: '^\s*bind-address\s*='
    line: "bind-address = 0.0.0.0"
  notify: Reiniciar MariaDB

- name: MariaDB ativo no boot
  ansible.builtin.service:
    name: mariadb
    state: started
    enabled: true

- name: Aplicar mudancas de configuracao antes de criar o usuario
  ansible.builtin.meta: flush_handlers

- name: Banco e usuario da app (idempotente)
  ansible.builtin.command:
    cmd: mysql --batch
    stdin: |
      CREATE DATABASE IF NOT EXISTS `{{ db_name }}` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
      CREATE USER IF NOT EXISTS '{{ db_user }}'@'{{ db_user_host }}' IDENTIFIED BY '{{ db_password }}';
      ALTER USER '{{ db_user }}'@'{{ db_user_host }}' IDENTIFIED BY '{{ db_password }}';
      GRANT ALL PRIVILEGES ON `{{ db_name }}`.* TO '{{ db_user }}'@'{{ db_user_host }}';
      FLUSH PRIVILEGES;
  changed_when: false
  no_log: true
