{# HTTPS so do Horizon: o Kolla so liga o TLS externo com um VIP externo separado.
   O .pem e gravado pelo ./lab.sh cert cloud; sem ele este arquivo sai vazio e o deploy segue
   so com HTTP. O kolla-ansible renderiza este template no proprio host (AIO), como root. #}
{% if (node_config_directory ~ '/haproxy/haproxy.pem') is file %}
frontend horizon_https_front
    mode http
    http-request set-header X-Forwarded-Proto https
    bind {{ kolla_internal_vip_address }}:443 ssl crt /etc/haproxy/certificates/haproxy.pem
    default_backend horizon_back
{% endif %}
